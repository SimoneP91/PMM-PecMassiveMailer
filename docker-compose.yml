# Local environment: docker compose up
#
#   api        http://localhost:3000      Swagger UI on /docs
#   worker     sends, reads receipts, dispatches notifications
#   mongo      MongoDB 8 as a single node replica set (transactions, change streams)
#   greenmail  fake PEC provider: SMTP 3025/3465, IMAP 3143/3993, web UI 8080
#
# Nothing here reaches a real PEC mailbox. The example config points the
# "serfin-aruba" mailbox preset at Greenmail through the overrides below.

services:
  mongo:
    image: mongo:8
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first run, then reports its health.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  greenmail:
    image: greenmail/standalone:2.1.4
    environment:
      # auth.disabled: any login/password is accepted and the user is created on
      # the fly, so every mailbox declared in config/pecmailer.yaml works here
      # with the full address as username (as with the real providers) and
      # whatever MAILBOX_<CODE>_PASSWORD says. Refused logins are covered by
      # the automated tests, not by this stack.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=true
        -Dgreenmail.verbose
    ports:
      - '3025:3025' # SMTP
      - '3465:3465' # SMTPS
      - '3143:3143' # IMAP
      - '3993:3993' # IMAPS
      - '8080:8080' # web UI and REST API
    healthcheck:
      # The image ships no curl or wget; bash's /dev/tcp is enough to see the
      # SMTP and IMAP listeners answer.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/3025 && exec 4<>/dev/tcp/127.0.0.1/3143']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: pecmailer:local
    command: ['node', 'dist/main.api.js']
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/pecmailer?directConnection=true
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: '3000'
      CONFIG_FILE: /config/pecmailer.yaml
      STORAGE_DIR: /data/storage
      LOG_PRETTY: 'false'
    ports:
      - '3000:3000'
    volumes:
      - ./config/pecmailer.yaml:/config/pecmailer.yaml:ro
      - storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    image: pecmailer:local
    command: ['node', 'dist/main.worker.js']
    # The worker serves its own probes on WORKER_HEALTH_PORT (see src/app/worker-health.ts).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/pecmailer?directConnection=true
      CONFIG_FILE: /config/pecmailer.yaml
      STORAGE_DIR: /data/storage
      LOG_PRETTY: 'false'
      WORKER_HEALTH_PORT: '3001'
      # Greenmail stands in for every provider on the local stack.
      PECMAILER_SMTP_OVERRIDE_HOST: greenmail
      PECMAILER_SMTP_OVERRIDE_PORT: '3025'
      PECMAILER_SMTP_OVERRIDE_SECURITY: none
      PECMAILER_IMAP_OVERRIDE_HOST: greenmail
      PECMAILER_IMAP_OVERRIDE_PORT: '3143'
      PECMAILER_IMAP_OVERRIDE_SECURITY: none
    ports:
      - '3001:3001' # worker health probes
    volumes:
      - ./config/pecmailer.yaml:/config/pecmailer.yaml:ro
      - storage:/data/storage
    depends_on:
      mongo:
        condition: service_healthy
      greenmail:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  mongo-data:
  storage:
