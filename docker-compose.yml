# Local stack: RabbitMQ, Greenmail (a fake PEC provider) and two pecmailer
# containers, one per mailbox of the tenant "serfin", both sending to Greenmail.
#
#   docker compose up --build
#
#   RabbitMQ page   http://localhost:15672   (user pecmailer, password pecmailer)
#   Greenmail       http://localhost:8080
#   probes          http://localhost:3001/health/ready (serfin-aruba), :3002 (serfin-legalmail)
#
# Every value here is for this machine only: in Kubernetes each container gets
# the same variables from a ConfigMap and a Secret.

x-pecmailer: &pecmailer
  image: pecmailer:local
  build:
    context: .
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  depends_on:
    rabbitmq:
      condition: service_healthy
    greenmail:
      condition: service_healthy

x-pecmailer-env: &pecmailer-env
  LOG_LEVEL: info
  RABBITMQ_URL: amqp://pecmailer:pecmailer@rabbitmq:5672
  PECMAILER_TENANT: serfin
  # Greenmail instead of the provider's servers; it accepts any password.
  PECMAILER_SMTP_HOST: greenmail
  PECMAILER_SMTP_PORT: '3025'
  PECMAILER_SMTP_SECURITY: none
  PECMAILER_SMTP_PASSWORD: greenmail-accepts-any-password
  PECMAILER_IMAP_HOST: greenmail
  PECMAILER_IMAP_PORT: '3143'
  PECMAILER_IMAP_SECURITY: none
  # The reserved domain of the examples counts as PEC here, so examples/pec.json goes through;
  # anywhere else it is refused, and a copied example cannot reach a real person.
  PECMAILER_PEC_DOMAINS: pec.example

services:
  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: pecmailer
      RABBITMQ_DEFAULT_PASS: pecmailer
    ports:
      - '5672:5672' # AMQP, for the containers and for `npm run cli` from this machine
      - '15672:15672' # management page
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-pecmailer.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s

  greenmail:
    image: greenmail/standalone:2.1.4
    environment:
      # auth.disabled: any login and password are accepted and the user is
      # created on the fly, with the full address as username (as with the real
      # providers). Refused logins are covered by the automated tests.
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=true
        -Dgreenmail.verbose
    ports:
      - '3025:3025' # SMTP
      - '3143:3143' # IMAP
      - '8080:8080' # web page and REST API
    healthcheck:
      # The image ships no curl or wget; bash's /dev/tcp is enough to see the
      # SMTP and IMAP listeners answer.
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/3025 && exec 4<>/dev/tcp/127.0.0.1/3143']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  serfin-aruba:
    <<: *pecmailer
    environment:
      <<: *pecmailer-env
      PECMAILER_MAILBOX: serfin-aruba
      PECMAILER_PROVIDER: aruba
      PECMAILER_FROM_ADDRESS: solleciti@pec.serfin.example
      PECMAILER_FROM_NAME: Serfin - Recupero Crediti
    ports:
      - '3001:3001'

  serfin-legalmail:
    <<: *pecmailer
    environment:
      <<: *pecmailer-env
      PECMAILER_MAILBOX: serfin-legalmail
      PECMAILER_PROVIDER: legalmail
      PECMAILER_FROM_ADDRESS: avvisi@legalmail.serfin.example
      PECMAILER_FROM_NAME: Serfin - Avvisi
    ports:
      - '3002:3001'

volumes:
  rabbitmq-data:
