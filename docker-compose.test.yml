# Backing services for the integration suite, nothing else:
#   docker compose -f docker-compose.test.yml up -d --wait
#   npm run test:integration
#   docker compose -f docker-compose.test.yml down
#
# A project of its own and different ports from docker-compose.yml, so both
# stacks can run at once without seeing each other's containers.

name: pecmailer-test

services:
  rabbitmq-test:
    image: rabbitmq:4.3
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    ports:
      - '5673:5672'
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-pecmailer.conf:ro
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 10s

  greenmail-test:
    image: greenmail/standalone:2.1.4
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=true
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/3025 && exec 4<>/dev/tcp/127.0.0.1/3143']
      interval: 3s
      timeout: 5s
      retries: 20
    ports:
      - '13025:3025'
      - '13143:3143'
