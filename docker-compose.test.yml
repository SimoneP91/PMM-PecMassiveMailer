# Backing services for the integration suite, nothing else:
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:integration
#   docker compose -f docker-compose.test.yml down -v
#
# Different ports from docker-compose.yml, so both stacks can run at once.

services:
  mongo-test:
    image: mongo:8
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27018:27017'
    tmpfs:
      - /data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 3s
      timeout: 5s
      retries: 20

  greenmail-test:
    image: greenmail/standalone:2.1.4
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=true
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/3025 && exec 4<>/dev/tcp/127.0.0.1/3143']
      interval: 3s
      timeout: 5s
      retries: 20
    ports:
      - '13025:3025'
      - '13143:3143'
      - '18080:8080'
