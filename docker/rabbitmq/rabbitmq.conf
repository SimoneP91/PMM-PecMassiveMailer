# RabbitMQ settings pecmailer relies on. Used by the local and test stacks;
# whoever runs RabbitMQ in production applies the same two.

# A PEC can weigh 30 MB; inside a JSON message, base64 makes it about 40 MB,
# and a complete delivery receipt carries the whole PEC. The default is 16 MB.
max_message_size = 67108864

# 30 minutes, the default, written down because the container sizes its
# retries on it: a message not acknowledged within it is taken back.
consumer_timeout = 1800000
